<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="RevSuite — the throttle for agentic parallelism">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#131c33"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="820" height="240" rx="18" fill="url(#bg)"/>

  <!-- tachometer -->
  <g transform="translate(126,132)">
    <circle r="74" fill="none" stroke="#22304d" stroke-width="10"/>
    <path d="M -52 52 A 74 74 0 1 1 63 -38" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
    <!-- redline ticks -->
    <g stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="55" y1="-46" x2="66" y2="-55"/>
      <line x1="66" y1="-26" x2="78" y2="-31"/>
    </g>
    <!-- band ticks 5..10 -->
    <g stroke="#7c8db5" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
      <line x1="-63" y1="-38" x2="-74" y2="-45"/>
      <line x1="-38" y1="-63" x2="-45" y2="-74"/>
      <line x1="-6" y1="-73" x2="-7" y2="-85"/>
      <line x1="26" y1="-69" x2="30" y2="-80"/>
    </g>
    <line x1="0" y1="0" x2="52" y2="-46" stroke="url(#needle)" stroke-width="7" stroke-linecap="round"/>
    <circle r="9" fill="#0b1220" stroke="#a78bfa" stroke-width="4"/>
    <text x="0" y="58" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8ea2c9">5 — 10</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(246,0)">
    <text x="0" y="94" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#f2f6ff" letter-spacing="-1.2">Rev<tspan fill="#a78bfa">Suite</tspan></text>
    <text x="2" y="128" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#7fe7f3">Time is money - rev up!</text>
    <text x="2" y="152" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#9fb2d4">the throttle for agentic parallelism</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#7fe7f3">
      <rect x="0" y="172" width="88" height="30" rx="8" fill="#0f1a2e" stroke="#22405e"/>
      <text x="16" y="192">/rev</text>
      <rect x="100" y="172" width="134" height="30" rx="8" fill="#0f1a2e" stroke="#22405e"/>
      <text x="116" y="192">/rev down</text>
      <rect x="246" y="172" width="126" height="30" rx="8" fill="#0f1a2e" stroke="#22405e"/>
      <text x="262" y="192">/collapse</text>
      <rect x="384" y="172" width="122" height="30" rx="8" fill="#0f1a2e" stroke="#22405e"/>
      <text x="400" y="192">/priority</text>
    </g>
  </g>
</svg>
